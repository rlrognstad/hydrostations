[project]
name = "hydrostations"
version = "0.1.0"
description = "A unified station-catalog client for hydrological networks"
readme = "README.md"
authors = [
    { name = "rlrognstad", email = "rlrognstad@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML_TEMPLATE is an embedded CSS/JS template, not Python logic -- long
# one-liner CSS/JS rules are the norm there, not a readability problem.
"examples/render_coverage_map.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
