source_id: bom
name: Bureau of Meteorology Water Data Online
operator: Australian Bureau of Meteorology
source_class: agency
protocol: kiwis
endpoint: https://www.bom.gov.au/waterdata/services
license: "CC BY 4.0 (Bureau of Meteorology, Australia)"
redistribution_ok: true
compartments: [Q, GW]
coverage:
  - [112.0, -44.0, 154.0, -10.0]  # mainland Australia + Tasmania
notes: >
  KISTERS WISKI/KiWIS backend. Coverage bbox is a coarse hand declaration,
  not verified against a live source. Verified live for both Q and GW.
  return_fields is deliberately just the four fields the adapter actually
  reads (id/name/lat/lon) -- the original adapter also requested
  station_id/object_type/parametertype_name, unused dead weight carried
  over without question, and live testing during the protocol-adapter
  refactor found both object_type and parametertype_name currently trigger
  a server-side "DatasourceError: Could not access WDP" 500 on BoM's
  backend. Not related to our code; dropping the unused fields both fixes
  it and removes dead weight.
kiwis:
  datasource: "0"
  id_field: station_no
  name_field: station_name
  lat_field: station_latitude
  lon_field: station_longitude
  return_fields:
    - station_no
    - station_name
    - station_latitude
    - station_longitude
  parameter_type_by_compartment:
    Q: "Water Course Discharge"
    GW: "Ground Water Level"
