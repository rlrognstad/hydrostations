source_id: cocorahs
name: Community Collaborative Rain, Hail & Snow Network (CoCoRaHS)
operator: CoCoRaHS (Colorado State University / NOAA)
source_class: citizen
protocol: cocorahs_export
endpoint: https://data.cocorahs.org/cocorahs/export/exportstations.aspx
license: "CC BY 3.0, CoCoRaHS"
redistribution_ok: true
compartments: [P, SNOW]
coverage:
  - [-125.0, 24.0, -66.0, 49.5]  # CONUS
  - [-170.0, 51.0, -129.0, 72.0]  # Alaska
  - [-160.5, 18.5, -154.5, 22.5]  # Hawaii
  - [-68.5, 17.5, -64.3, 18.8]    # Puerto Rico + US Virgin Islands
  - [144.5, 13.2, 146.1, 15.4]    # Guam + Northern Mariana Islands
notes: >
  Covers both P and SNOW -- the same daily report form (and so the same
  station list) carries rainfall/hail *and* snowfall/snow-depth
  observations; there is no separate snow network, so both compartments
  are emitted from the same per-state fetch rather than two.
  Confirmed live: the documented Web API (api2.cocorahs.org) requires an
  API key ("Authorization has been denied for this request" without one).
  A separate, genuinely anonymous XML export endpoint
  (exportstations.aspx) is real and unauthenticated, but has no bbox
  filter and no "all states" mode -- state=a crashed the server with an
  OutOfMemoryException. Only a real per-state filter exists, so the full
  inventory is one request per state in the list below, aggregated, then
  filtered client-side (BulkFileAdapter), same shape as NRFA/SNOTEL.
  Real gotcha: the "currently reporting" status string is "Reporting",
  not "Active" -- confirmed live (Colorado: 0 stations with status
  "Active" vs 1,967 real "Reporting" out of 8,969 total). 50 states + DC
  plus the CoCoRaHS-operated US territories: PR (96 reporting), VI (35),
  GU (14), MP (2) -- all confirmed live as real per-jurisdiction filter
  codes. Canada (State=CAN, ~1,051 reporting) and the Bahamas (BHS, ~63)
  also run CoCoRaHS but have NO working filter code -- state=CAN / CN /
  CANADA / country=CA all fall through to an undocumented all-stations
  dump (any unrecognized state code returns every one of ~111,554 rows,
  a ~59 MB response; state=a specifically OOMs the server). Reachable
  only that way, so deliberately left out rather than depend on the
  fall-through. Performance note: a full 55-jurisdiction fetch takes
  ~40s live (one sequential HTTP request each, no way to batch) --
  noticeably slower than every other source in this register; a caller
  doing a broad multi-source query should expect CoCoRaHS to dominate
  the wall-clock time.
cocorahs:
  states:
    [AL, AK, AZ, AR, CA, CO, CT, DE, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA,
     ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK,
     OR, PA, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY, DC,
     PR, VI, GU, MP]
