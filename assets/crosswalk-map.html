<title>Murray-Darling basin: crosswalk partitions & stations</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --border:         rgba(11,11,11,0.10);
    --admin:          #2a78d6;   /* slot 1 blue */
    --basins:         #008300;   /* slot 2 green */
    --h3:             #e87ba4;   /* slot 3 magenta */
    --stations-q:     #eda100;   /* slot 4 yellow -- streamflow */
    --stations-gw:    #1baf7a;   /* slot 5 aqua -- groundwater */
    --boundary:       #3a3a38;   /* neutral ink, not a categorical slot */
    --inset-highlight: #c1502e;  /* rust, "you are here" marker -- not a data-layer color */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --border:         rgba(255,255,255,0.10);
      --admin:          #3987e5;
      --basins:         #008300;
      --h3:             #d55181;
      --stations-q:     #c98500;
      --stations-gw:    #199e70;
      --boundary:       #d6d5cc;
      --inset-highlight: #dd6a44;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --border:         rgba(255,255,255,0.10);
    --admin:          #3987e5;
    --basins:         #008300;
    --h3:             #d55181;
    --stations-q:     #c98500;
    --stations-gw:    #199e70;
    --boundary:       #d6d5cc;
    --inset-highlight: #dd6a44;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    padding: 24px;
    min-height: 100vh;
  }
  .viz-card {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .layout { display: flex; gap: 20px; align-items: flex-start; }
  .map-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface-1);
  }
  svg { display: block; width: 100%; height: auto; }

  .inset-map {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 96px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .inset-map svg { width: 100%; height: auto; }
  .inset-country { fill: var(--muted); fill-opacity: 0.25; stroke: var(--text-secondary); stroke-width: 1; }
  .inset-highlight { fill: var(--inset-highlight); fill-opacity: 0.5; stroke: var(--inset-highlight); stroke-width: 1; }

  .legend { flex: 0 0 220px; font-size: 13px; }
  .legend h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .legend-item:hover { background: var(--border); }
  .legend-item input { accent-color: var(--text-primary); margin: 0; }
  .swatch { width: 18px; height: 10px; flex: 0 0 auto; border-radius: 2px; }
  .swatch.line { height: 0; border-top-width: 2.5px; border-top-style: solid; }
  .swatch.dashed { border-top-style: dashed; }
  .swatch.dotted { border-top-style: dotted; border-top-width: 3px; }
  .swatch.dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-label { color: var(--text-primary); }
  .legend-count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .legend-note {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    line-height: 1.5;
  }

  .boundary-poly { fill: none; stroke: var(--boundary); stroke-width: 3; stroke-linejoin: round; }
  .basin-poly { fill: var(--basins); fill-opacity: 0.06; stroke: var(--basins); stroke-width: 1.6; stroke-dasharray: 6 3; }
  .admin-poly { fill: none; stroke: var(--admin); stroke-width: 2; }
  .h3-poly { fill: var(--h3); fill-opacity: 0.05; stroke: var(--h3); stroke-width: 1; stroke-dasharray: 1.5 2; }
  .station-dot.q { fill: var(--stations-q); stroke: var(--surface-1); stroke-width: 1; }
  .station-dot.gw { fill: var(--stations-gw); stroke: var(--surface-1); stroke-width: 1; }
  .station-dot:hover, .basin-poly:hover, .admin-poly:hover, .h3-poly:hover, .boundary-poly:hover { filter: brightness(1.3); }
  .hit { fill: transparent; stroke: transparent; stroke-width: 6px; cursor: pointer; }

  .layer-hidden { display: none; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--text-primary);
    color: var(--surface-1);
    font-size: 12px;
    line-height: 1.4;
    padding: 6px 9px;
    border-radius: 6px;
    max-width: 220px;
    transform: translate(-50%, -100%);
    margin-top: -10px;
    opacity: 0;
    transition: opacity 0.08s;
    z-index: 10;
    white-space: nowrap;
  }
  #tooltip.visible { opacity: 1; }
  #tooltip .tt-kind { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.03em; }

  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .legend { flex: 1 1 auto; }
  }
</style>

        </div>
      </div>
    </div>
  </div>
</div>

  const svg = document.getElementById('map');
  const tooltip = document.getElementById('tooltip');
  const wrap = document.querySelector('.map-wrap');
  const NS = 'http://www.w3.org/2000/svg';

  function ringsToPath(rings) {
    return rings.map(ring => 'M' + ring.map(p => p.join(',')).join('L') + 'Z').join(' ');
  }

  function makeGroup(id) {
    const g = document.createElementNS(NS, 'g');
    g.id = id;
    svg.appendChild(g);
    return g;
  }

  const gBoundary = makeGroup('layer-boundary');
  const gAdmin = makeGroup('layer-admin');
  const gBasins = makeGroup('layer-basins');
  const gH3 = makeGroup('layer-h3');
  const gStationsQ = makeGroup('layer-stationsQ');
  const gStationsGW = makeGroup('layer-stationsGW');

  function showTooltip(evt, kind, label) {
    tooltip.innerHTML = '<div class="tt-kind">' + kind + '</div>' + label;
    tooltip.classList.add('visible');
    moveTooltip(evt);
  }
  function moveTooltip(evt) {
    const box = wrap.getBoundingClientRect();
    tooltip.style.left = (evt.clientX - box.left) + 'px';
    tooltip.style.top = (evt.clientY - box.top) + 'px';
  }
  function hideTooltip() { tooltip.classList.remove('visible'); }

  function addPolygonLayer(group, items, cssClass, kind, labelFn) {
    for (const item of items) {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', ringsToPath(item.rings));
      path.setAttribute('class', cssClass);
      path.addEventListener('mousemove', e => showTooltip(e, kind, labelFn(item)));
      path.addEventListener('mouseleave', hideTooltip);
      group.appendChild(path);
    }
  }

  addPolygonLayer(gBoundary, [data.boundary], 'boundary-poly', 'Basin', it => it.name);
  addPolygonLayer(gAdmin, data.admin, 'admin-poly', 'Admin unit', it => it.name);
  addPolygonLayer(gBasins, data.basins, 'basin-poly', 'HydroBASINS sub-basin', it => 'HYBAS_ID ' + it.id);
  addPolygonLayer(gH3, data.h3, 'h3-poly', 'H3 cell', it => it.id);

  const stationGroups = { Q: gStationsQ, GW: gStationsGW };
  const stationClass = { Q: 'q', GW: 'gw' };

  for (const st of data.stations) {
    const group = stationGroups[st.compartment];
    if (!group) continue;
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', st.x);
    c.setAttribute('cy', st.y);
    c.setAttribute('r', 2.2);
    c.setAttribute('class', 'station-dot hit ' + stationClass[st.compartment]);
    c.addEventListener('mousemove', e => showTooltip(e, st.compartment === 'Q' ? 'Streamflow station' : 'Groundwater station', st.name + ' (' + st.id + ')'));
    c.addEventListener('mouseleave', hideTooltip);
    group.appendChild(c);
  }
  // repaint visible dots on top of the larger invisible hit targets
  for (const st of data.stations) {
    const group = stationGroups[st.compartment];
    if (!group) continue;
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', st.x);
    c.setAttribute('cy', st.y);
    c.setAttribute('r', 2.2);
    c.setAttribute('class', 'station-dot ' + stationClass[st.compartment]);
    c.style.pointerEvents = 'none';
    group.appendChild(c);
  }

  const stationsQCount = data.stations.filter(st => st.compartment === 'Q').length;
  const stationsGWCount = data.stations.filter(st => st.compartment === 'GW').length;

  document.getElementById('count-boundary').textContent = '1';
  document.getElementById('count-admin').textContent = data.admin.length;
  document.getElementById('count-basins').textContent = data.basins.length;
  document.getElementById('count-h3').textContent = data.h3.length;
  document.getElementById('count-stationsQ').textContent = stationsQCount;
  document.getElementById('count-stationsGW').textContent = stationsGWCount;

  const insetSvg = document.getElementById('inset');
  insetSvg.setAttribute('viewBox', '0 0 ' + data.inset.width + ' ' + data.inset.height);
  const insetCountry = document.createElementNS(NS, 'path');
  insetCountry.setAttribute('d', ringsToPath(data.inset.country.rings));
  insetCountry.setAttribute('class', 'inset-country');
  insetSvg.appendChild(insetCountry);
  const insetHighlight = document.createElementNS(NS, 'rect');
  insetHighlight.setAttribute('x', data.inset.highlight.x);
  insetHighlight.setAttribute('y', data.inset.highlight.y);
  insetHighlight.setAttribute('width', data.inset.highlight.w);
  insetHighlight.setAttribute('height', data.inset.highlight.h);
  insetHighlight.setAttribute('class', 'inset-highlight');
  insetSvg.appendChild(insetHighlight);

  const groups = {
    boundary: gBoundary, admin: gAdmin, basins: gBasins, h3: gH3,
    stationsQ: gStationsQ, stationsGW: gStationsGW,
  };
  document.querySelectorAll('.legend-item input').forEach(input => {
    input.addEventListener('change', () => {
      groups[input.dataset.layer].classList.toggle('layer-hidden', !input.checked);
    });
  });
})();
</script>
